# Ennie Coffee — the one load-balancing layer (CEF operations/load-balancing.md, LB-01…LB-18).
#
# Traefik (hosting platform) → this HAProxy → N stateless app instances.
# Traefik terminates TLS and addresses this container by name; HAProxy owns distribution.

global
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  option dontlognull
  # Appends the address HAProxy received the request from (Traefik) to X-Forwarded-For. The app
  # counts TRUSTED_PROXY_HOPS entries from the right, so a client-supplied value is never trusted.
  option forwardfor
  option redispatch
  retries 2
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout http-keep-alive 5s
  # LB-05: requests beyond an instance's concurrency limit wait in a bounded queue, then are shed.
  timeout queue 10s

# Docker's embedded DNS: `app` resolves to every running replica, re-read every few seconds, so
# scaling the service up or down changes membership without a reload.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold other 5s
  hold refused 5s
  hold nx 5s
  hold timeout 5s
  accepted_payload_size 8192

frontend web
  bind :80
  # Container healthcheck for this balancer itself.
  monitor-uri /_lb/health

  # LB-12: the client address behind Traefik is the last X-Forwarded-For entry Traefik wrote;
  # without a proxy in front (local stack) it is the connection's own source.
  http-request set-var(txn.client) req.hdr(x-forwarded-for,-1) if { req.hdr(x-forwarded-for) -m found }
  http-request set-var(txn.client) src if !{ var(txn.client) -m found }

  # LB-13: volume is absorbed here; business limits (per account, per endpoint) stay in the app.
  stick-table type string len 64 size 200k expire 2m store http_req_rate(10s)
  http-request track-sc0 var(txn.client)

  acl auth_path path_beg /api/auth/
  acl admin_path path_beg /admin /api/admin/
  acl static_path path_beg /_next/static/ /_next/image /media/

  # LB-15: privileged surfaces get a tighter edge budget in addition to the app's own checks.
  http-request return status 429 content-type "text/plain; charset=utf-8" string "Túl sok kérés. Próbáld újra később." hdr Retry-After 30 if auth_path { sc_http_req_rate(0) gt 30 }
  http-request return status 429 content-type "text/plain; charset=utf-8" string "Túl sok kérés. Próbáld újra később." hdr Retry-After 10 if admin_path { sc_http_req_rate(0) gt 120 }
  http-request return status 429 content-type "text/plain; charset=utf-8" string "Túl sok kérés. Próbáld újra később." hdr Retry-After 10 if !static_path { sc_http_req_rate(0) gt 300 }

  # Admin responses are never cached by anything in front of the app.
  http-response set-header Cache-Control no-store if admin_path

  default_backend app

backend app
  # LB-02: least-connections — request cost varies, so even request counts are not even load.
  balance leastconn
  # LB-06/07/08: readiness decides membership, polled actively; 3 failures evict, 2 successes return.
  option httpchk
  http-check send meth GET uri /api/health/ready ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  # LB-04: at most 64 requests in flight per instance; the rest queue (bounded above).
  # LB-09: slowstart eases a returning instance back in instead of flooding it.
  default-server check inter 5s fastinter 2s downinter 5s fall 3 rise 2 slowstart 15s maxconn 64 maxqueue 512 resolvers docker init-addr none
  # Up to 8 replicas are discovered from DNS; unused slots stay in maintenance.
  server-template app 1-8 app:80
  # LB-10: with no ready instance the request is answered 503 + Retry-After, never held.
  errorfile 503 /usr/local/etc/haproxy/errors/503.http

# LB-16: per-instance request rate, errors, and latency for monitoring — internal network only,
# never routed by Traefik (it only knows this container's port 80).
frontend metrics
  bind :8404
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /stats
  stats refresh 10s
