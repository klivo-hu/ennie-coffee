# LOCAL DEVELOPMENT ONLY — hot reload inside a container. Production is docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:3000
#
# Never rename this file to docker-compose.override.yml: Compose would merge it into production.
name: ennie-coffee-dev

services:
  web:
    build:
      context: .
      target: dev
    volumes:
      # Source is bind-mounted so edits reload in place. The anonymous volumes keep the image's
      # Linux-built node_modules and .next from being shadowed by the host directory.
      - .:/app
      - /app/node_modules
      - /app/.next
      # The data store is a named volume rather than part of the bind mount, so the JSON files and
      # the encoded imagery never appear in the working tree (and can never be committed).
      - ennie-dev-data:/app/data
    ports:
      - '3000:3000'
    env_file:
      - .env
      - docker/local.env
    environment:
      NODE_ENV: development
      SITE_URL: http://localhost:3000
      TRUSTED_PROXY_HOPS: '0'
      DATA_DIR: /app/data
      # Bind-mounted file events do not always reach the container on Windows and macOS.
      WATCHPACK_POLLING: 'true'

volumes:
  ennie-dev-data:
