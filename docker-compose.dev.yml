# LOCAL DEVELOPMENT ONLY — production is docker-compose.yml.
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:3000
name: ennie-coffee-dev

services:
  web:
    build:
      context: .
      target: dev
    # Source is bind-mounted so edits hot-reload without a rebuild. The anonymous volume keeps
    # the image's Linux-built node_modules from being shadowed by the host's directory.
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
