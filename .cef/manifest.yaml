metadata:
  description: >-
    Ennie Coffee Kávéház — an independent cafe and coffee house in Hatvan,
    Hungary (Kossuth tér 10), welcoming guests since 2015. A hospitality venue
    website in Hungarian: a home page, an editorial menu page (Árlista) of
    coffee, matcha and chai lattes, milkshakes, fruit smoothies, lemonades and
    hot chocolate, an about page telling the cafe story, and a contact page with
    a map, opening hours and location guidance; plus a secure admin area where
    staff manage menu items, prices, categories, images and social links.
