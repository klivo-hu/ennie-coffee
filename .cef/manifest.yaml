metadata:
  description: Ennie Coffee (Ennie Coffee Kávéház) — premium independent coffee
    shop in Hatvan, Hungary (Kossuth tér 10), open since 2015.
    Hungarian-language public website with a homepage, an editorial price list
    (Árlista) of coffees, matcha and chai lattes, milkshakes, fruit smoothies,
    lemonades and hot chocolates, an about page, and a contact page with map and
    opening hours; plus a secure admin panel to manage products, prices,
    categories, images and social links.
  framework: nextjs
  language: typescript
  packageManager: pnpm
  styling: tailwind
  uiLibrary: shadcn
  animation: gsap
  database: postgres
  orm: drizzle
