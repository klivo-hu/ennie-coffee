# LOCAL, PRODUCTION-LIKE STACK — the same image and the same single-container topology as
# docker-compose.yml, on your own machine. The hosting platform never reads this file.
#
#   docker compose -f docker-compose.local.yml up --build
#   open http://localhost:8080          (admin: http://localhost:8080/admin)
#
# Settings come from .env (secrets and the admin account — see .env.example), with the localhost
# switches in docker/local.env applied on top.
name: ennie-coffee-local

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
      - docker/local.env
    environment:
      NODE_ENV: production
      # Nothing sits in front of the container locally, so the client address is the connection's.
      TRUSTED_PROXY_HOPS: '0'
      DATA_DIR: /app/data
    ports:
      - '8080:3000'
    volumes:
      # Same volume role as production. `docker compose -f docker-compose.local.yml down -v`
      # resets the site to its seeded state.
      - ennie-data:/app/data
    tmpfs:
      - /tmp
    stop_grace_period: 20s

volumes:
  ennie-data:
